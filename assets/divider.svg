<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24" role="img" aria-labelledby="t"><title id="t">Divider</title><defs><filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity="0.035"/></pattern><linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#39ff14"/><stop offset="1" stop-color="#00e5ff"/></linearGradient></defs><line x1="0" y1="12" x2="900" y2="12" stroke="url(#line)" stroke-width="2" opacity=".8"/><circle cy="12" r="4" fill="#39ff14" filter="url(#glow)" cx="0"><animate attributeName="cx" from="0" to="900" dur="6s" repeatCount="indefinite"/></circle></svg>
